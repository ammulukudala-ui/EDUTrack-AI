<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — EDUTrack AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="admin-dashboard">
<div id="shell"><main id="content">

<ul class="nav nav-pills mb-3" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabOverview">Overview</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabUsers">User management</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabAudit">System activity</button></li></ul>
<div class="tab-content"><div class="tab-pane fade show active" id="tabOverview">
<div class="row g-3 mb-3" id="cards"></div>
<div class="row g-3"><div class="col-lg-5"><div class="card h-100"><div class="card-header">Advisory risk distribution (latest assessments)</div><div class="card-body"><div class="chart-box"><canvas id="riskChart"></canvas></div></div></div></div><div class="col-lg-7"><div class="card h-100"><div class="card-header">Subject averages (all students)</div><div class="card-body"><div class="chart-box"><canvas id="subjChart"></canvas></div></div></div></div></div>
<p class="small text-muted mt-2" id="riskNote"></p></div>
<div class="tab-pane fade" id="tabUsers"><div id="usersCrud"></div></div>
<div class="tab-pane fade" id="tabAudit"><div class="card"><div class="card-header">Audit log of important actions</div><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody id="auditBody"></tbody></table></div><div class="card-footer bg-transparent"><button class="btn btn-sm btn-outline-secondary" id="auditMore">Load more</button></div></div></div></div>
</main></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/dashboard.js"></script>
</body></html>
