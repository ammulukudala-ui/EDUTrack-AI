<body data-page="attendance">
<div id="shell"><main id="content">
<div class="alert alert-light border small py-2"><b>How attendance is calculated:</b> Present + Late count as attended. Absent counts as a missed class. Excused sessions are <b>not</b> counted. Attendance % = attended ÷ (Present + Late + Absent) × 100. With no counted sessions the page shows “Insufficient attendance data”.</div>
<div class="row g-3 mb-3" id="attCards"></div><div id="crud"></div>
</main></div>
