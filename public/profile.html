<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — EDUTrack AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="profile">
<div id="shell"><main id="content">
<div class="row g-3"><div class="col-lg-6"><div class="card"><div class="card-header">My profile</div><div class="card-body"><form id="profileForm" novalidate><div class="alert d-none" id="pMsg"></div>
<div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required minlength="2"></div>
<div class="mb-3"><label class="form-label">Email (cannot be changed here)</label><input class="form-control" id="pEmail" disabled></div>
<div class="row"><div class="col-6 mb-3"><label class="form-label">Role</label><input class="form-control" id="pRole" disabled></div><div class="col-6 mb-3 stu"><label class="form-label">Student ID</label><input class="form-control" id="pSid" disabled></div></div>
<div class="row stu"><div class="col-4 mb-3"><label class="form-label">Department</label><input class="form-control" id="pDept" disabled></div><div class="col-4 mb-3"><label class="form-label">Semester</label><input class="form-control" id="pSem" disabled></div><div class="col-4 mb-3"><label class="form-label">Year</label><input class="form-control" id="pYear" disabled></div></div>
<div class="mb-3 stu"><label class="form-label">Phone</label><input class="form-control" name="phone" placeholder="Optional"></div><button class="btn btn-primary">Save profile</button></form></div></div></div>
<div class="col-lg-6"><div class="card"><div class="card-header">Change password</div><div class="card-body"><form id="pwForm" novalidate><div class="alert d-none" id="wMsg"></div>
<div class="mb-3"><label class="form-label">Current password</label><input type="password" class="form-control" name="currentPassword" required autocomplete="current-password"></div>
<div class="mb-3"><label class="form-label">New password</label><input type="password" class="form-control" name="newPassword" required autocomplete="new-password"><div class="form-text">8+ characters with upper-case, lower-case and a number.</div></div>
<div class="mb-3"><label class="form-label">Confirm new password</label><input type="password" class="form-control" name="confirm" required autocomplete="new-password"></div><button class="btn btn-primary">Change password</button></form></div></div></div></div>
</main></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/profile.js"></script>
</body></html>
