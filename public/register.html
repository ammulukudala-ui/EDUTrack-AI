<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create student account — EDUTrack AI</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css"></head>
<body><div class="auth-wrap"><div class="card auth-card"><a href="/" class="text-decoration-none text-center mb-3 d-block fs-4 fw-bold" style="color:var(--navy)"><i class="bi bi-mortarboard-fill text-teal"></i> EDUTrack AI</a>
<h4 class="text-center">Create student account</h4><p class="text-center text-muted small">Faculty and admin accounts are created by an administrator.</p><form id="regForm" novalidate><div class="alert alert-danger d-none" id="msg" role="alert"></div><div class="row g-3">
<div class="col-12"><label class="form-label">Full name</label><input class="form-control" name="name" required minlength="2" maxlength="80"></div>
<div class="col-md-6"><label class="form-label">Student ID</label><input class="form-control" name="studentId" required maxlength="30"></div>
<div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department" required placeholder="e.g. Computer Science"></div>
<div class="col-12"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required autocomplete="username"></div>
<div class="col-6"><label class="form-label">Semester</label><select class="form-select" name="semester" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
<div class="col-6"><label class="form-label">Year of study</label><select class="form-select" name="year" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div class="col-12"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required autocomplete="new-password"><div class="form-text">8+ characters with upper-case, lower-case and a number.</div></div>
<div class="col-12"><label class="form-label">Confirm password</label><input type="password" class="form-control" name="confirmPassword" required autocomplete="new-password"></div></div>
<button class="btn btn-primary w-100 mt-3" type="submit">Register</button></form><p class="text-center small mt-3 mb-0">Already registered? <a href="/login.html">Log in</a></p></div></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/main.js"></script><script src="/js/auth.js"></script></body></html>
