<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard — EDUTrack AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="student-dashboard">
<div id="shell"><main id="content">
<div class="card mb-3"><div class="card-body py-2"><div class="row g-2 align-items-end">
<div class="col-6 col-md-2"><label class="form-label small mb-0">From</label><input type="date" id="fFrom" class="form-control form-control-sm"></div>
<div class="col-6 col-md-2"><label class="form-label small mb-0">To</label><input type="date" id="fTo" class="form-control form-control-sm"></div>
<div class="col-auto"><button class="btn btn-sm btn-primary" id="applyBtn">Apply</button> <button class="btn btn-sm btn-light" id="resetBtn">Reset</button></div></div></div></div>
<div class="row g-3 mb-3" id="cards"></div>
<div class="row g-3 mb-3"><div class="col-lg-7"><div class="card h-100"><div class="card-header">Subject-wise average marks</div><div class="card-body"><div class="chart-box"><canvas id="subjChart"></canvas></div></div></div></div><div class="col-lg-5"><div class="card h-100"><div class="card-header">Study time per week (hours)</div><div class="card-body"><div class="chart-box"><canvas id="weekChart"></canvas></div></div></div></div></div>
<div class="row g-3 mb-3">
<div class="col-lg-4"><div class="card h-100"><div class="card-header">Academic risk summary <span class="badge text-bg-light">advisory</span></div><div class="card-body" id="riskBox"></div></div></div>
<div class="col-lg-4"><div class="card h-100"><div class="card-header">Attendance summary</div><div class="card-body p-0" id="attBox"></div></div></div>
<div class="col-lg-4"><div class="card h-100"><div class="card-header d-flex justify-content-between">Recommendations <a href="/recommendations.html" class="small">View all</a></div><div class="card-body" id="recBox"></div></div></div></div>
<div class="row g-3"><div class="col-lg-7"><div class="card h-100"><div class="card-header">Recent academic records</div><div class="card-body p-0" id="recentBox"></div></div></div>
<div class="col-lg-5"><div class="card h-100"><div class="card-header d-flex justify-content-between">Upcoming study tasks <a href="/study-planner.html" class="small">Planner</a></div><div class="card-body p-0" id="taskBox"></div></div></div></div>
</main></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/dashboard.js"></script>
</body></html>
