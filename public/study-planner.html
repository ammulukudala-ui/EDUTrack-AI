<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Planner — EDUTrack AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="study-planner">
<div id="shell"><main id="content">
<div class="row g-3 mb-3"><div class="col-lg-4"><div class="card h-100"><div class="card-header">Progress</div><div class="card-body" id="taskProgress"></div></div></div>
<div class="col-lg-8"><div class="card h-100"><div class="card-header d-flex justify-content-between align-items-center"><button class="btn btn-sm btn-light" id="calPrev"><i class="bi bi-chevron-left"></i></button><span id="calTitle" class="fw-semibold"></span><button class="btn btn-sm btn-light" id="calNext"><i class="bi bi-chevron-right"></i></button></div><div class="card-body"><div class="cal" id="cal"></div></div></div></div></div><div id="crud"></div>
</main></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/tasks.js"></script>
</body></html>
