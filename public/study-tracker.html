<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Tracker — EDUTrack AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/style.css"></head>
<body data-page="study-tracker">
<div id="shell"><main id="content">
<div class="row g-3 mb-3" id="studyCards"></div>
<div class="row g-3 mb-3"><div class="col-lg-7"><div class="card h-100"><div class="card-header">Daily study time – last 14 days (minutes)</div><div class="card-body"><div class="chart-box"><canvas id="daysChart"></canvas></div></div></div></div><div class="col-lg-5"><div class="card h-100"><div class="card-header">Study time by subject</div><div class="card-body"><div class="chart-box"><canvas id="subjStudyChart"></canvas></div></div></div></div></div>
<p class="small text-muted">Study time is shown for awareness next to your marks. More hours do not automatically mean better results.</p><div id="crud"></div>
</main></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/study.js"></script>
</body></html>
